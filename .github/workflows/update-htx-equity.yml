name: Update HTX Equity

on:
  schedule:
    # Daily at 22:00 UTC+8 (14:00 UTC)
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-equity:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch HTX equity
        env:
          HTX_AK: ${{ secrets.HTX_AK }}
          HTX_SK: ${{ secrets.HTX_SK }}
          HTX_VALUATION_ASSET: USDT
        run: python3 scripts/fetch_htx_equity.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/htx_equity.csv
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update HTX equity data for $(date -u +%Y-%m-%d)"
          git push
